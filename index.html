<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<title>CF Installer v3.0.4</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;--text:#e0e0ec;--text2:#8888a0;--text3:#55556a;--cyan:#00e5a0;--cyan2:#00b8ff;--cyan-bg:rgba(0,229,160,.12);--green:#00e676;--green-bg:rgba(0,230,118,.08);--red:#ff4466;--red-bg:rgba(255,68,102,.08);--yellow:#ffaa00;--yellow-bg:rgba(255,170,0,.08);--border:#2a2a40;--border2:#3a3a55;--radius:12px;--radius2:16px;--shadow:0 8px 32px rgba(0,0,0,.45);--font:'Vazirmatn',system-ui,sans-serif;--font-mono:'SF Mono','Cascadia Code','Fira Code',monospace}
html{font-size:15px}body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;line-height:1.6;padding-bottom:20px}
*{scrollbar-width:thin;scrollbar-color:var(--border2) var(--bg)}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.container{width:100%;max-width:720px;padding:20px 16px 40px}
.header{text-align:center;margin-bottom:24px}
.logo{font-size:2.2rem;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,var(--cyan),var(--cyan2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{color:var(--text2);font-size:.85rem;margin-top:4px}
.logo-ver{display:inline-block;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:2px 12px;font-size:.7rem;color:var(--text3);margin-top:8px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:28px;box-shadow:var(--shadow);width:100%;margin-bottom:16px}
.card-title{font-size:1.3rem;font-weight:700;margin-bottom:6px;color:var(--cyan)}
.card-subtitle{color:var(--text2);font-size:.88rem;margin-bottom:20px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.95rem;font-family:var(--font-mono);transition:all .25s;outline:none;min-height:46px}
.form-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,160,.15)}
.form-input::placeholder{color:var(--text3);font-family:var(--font)}
.form-hint{font-size:.78rem;color:var(--text3);margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--radius);font-size:.92rem;font-weight:600;cursor:pointer;border:none;transition:all .25s;font-family:var(--font);min-height:46px;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--cyan);color:#0a0a0f;box-shadow:0 4px 16px rgba(0,229,160,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,229,160,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-group{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn-sm{padding:8px 16px;font-size:.82rem;min-height:36px}
.alert{padding:12px 16px;border-radius:var(--radius);font-size:.85rem;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;line-height:1.5}
.alert-info{background:var(--cyan-bg);border:1px solid rgba(0,229,160,.2);color:var(--cyan)}
.alert-success{background:var(--green-bg);border:1px solid rgba(0,230,118,.2);color:var(--green)}
.alert-error{background:var(--red-bg);border:1px solid rgba(255,68,102,.2);color:var(--red)}
.alert-warn{background:var(--yellow-bg);border:1px solid rgba(255,170,0,.2);color:var(--yellow)}
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.deploy-log{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:var(--font-mono);font-size:.82rem;max-height:300px;overflow-y:auto;line-height:1.8;color:var(--text2);margin-top:12px}
.deploy-log .log-ok{color:var(--green)}.deploy-log .log-err{color:var(--red)}.deploy-log .log-info{color:var(--cyan)}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.panel-card{background:var(--bg3);border:2px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .25s;text-align:center}
.panel-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.panel-card.selected{border-color:var(--cyan);box-shadow:0 0 24px rgba(0,229,160,.15)}
.panel-icon{font-size:2rem;margin-bottom:8px}
.panel-name{font-weight:700;font-size:1rem;margin-bottom:4px}
.panel-desc{font-size:.78rem;color:var(--text3)}
.result-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.result-label{font-size:.78rem;color:var(--text2);margin-bottom:4px}
.result-value{font-family:var(--font-mono);font-size:.9rem;color:var(--cyan);overflow-wrap:anywhere;word-break:break-all;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.copy-btn{background:var(--bg4);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.78rem;transition:all .25s;flex-shrink:0}
.copy-btn:hover{color:var(--cyan);border-color:var(--cyan)}
.copy-btn.copied{color:var(--green);border-color:var(--green)}
.divider{border-top:1px solid var(--border);margin:20px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;color:var(--text);z-index:100;opacity:0;transition:all .3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:640px){.panel-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo">CF INSTALLER</div>
    <div class="logo-sub">نصب‌کننده خودکار پنل‌های Cloudflare Worker</div>
    <div class="logo-ver">v3.0.4</div>
  </header>
  <div id="content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const BACKEND='https://cf-installer-backend.bldj.workers.dev';
const PANELS={
  nahan:{name:'Nahan Panel',icon:'🌙',desc:'پنل سبک و سریع با D1',key:'nahan'},
  edge:{name:'EdgeTunnel',icon:'⚡',desc:'پنل حرفه‌ای و محبوب با KV',key:'edge'},
  cfnew:{name:'Cfnew Panel',icon:'🆕',desc:'پنل مدرن با KV',key:'cfnew'},
  nova:{name:'Nova Proxy',icon:'🚀',desc:'پنل پیشرفته D1 + KV',key:'nova'}
};

let selectedPanel=null;
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function esc(s){return s?String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])):''}
function cpB(b,t){navigator.clipboard.writeText(t).then(()=>{const o=b.textContent;b.textContent='کپی شد!';b.classList.add('copied');setTimeout(()=>{b.textContent=o;b.classList.remove('copied')},1500)})}

function render(){
  const el=$('content');
  el.innerHTML=`
    <div class="card">
      <div class="card-title">🔑 توکن Cloudflare API</div>
      <div class="card-subtitle">API Token خود را وارد کنید</div>
      <a href="https://dash.cloudflare.com/profile/api-tokens" target="_blank" class="btn btn-primary btn-sm" style="text-decoration:none;margin-bottom:12px">🔑 ساخت API Token</a>
      <div class="form-group"><label class="form-label">API Token</label>
      <input type="password" class="form-input" id="tokenIn" placeholder="cfut_xxxxxxxxxxxxxxxx" autocomplete="off" style="direction:ltr;text-align:left"></div>
      <button class="btn btn-primary" id="validateBtn">🔍 بررسی توکن</button>
      <div id="tokenResult"></div>
    </div>
    <div class="card" id="panelCard" style="display:none">
      <div class="card-title">🎯 پنل مورد نظر را انتخاب کنید</div>
      <div class="panel-grid" id="panelGrid"></div>
      <div class="alert alert-info">💡 اسم Worker به صورت خودکار و رندوم ساخته میشود</div>
      <button class="btn btn-primary" id="deployBtn" disabled>🚀 نصب و فعال‌سازی</button>
    </div>
    <div class="card" id="deployCard" style="display:none">
      <div class="card-title">📦 در حال استقرار...</div>
      <div id="deployLog" class="deploy-log"></div>
      <div id="resultBox" style="display:none">
        <div class="divider"></div>
        <div class="result-box"><div class="result-label">آدرس پنل</div><div class="result-value"><a id="resUrl" href="#" target="_blank" style="color:var(--cyan);text-decoration:none"></a><button class="copy-btn" id="copyUrl">کپی</button></div></div>
        <div class="result-box"><div class="result-label">نام Worker</div><div class="result-value"><span id="resName"></span><button class="copy-btn" id="copyName">کپی</button></div></div>
        <div class="result-box"><div class="result-label">رمز عبور پیش‌فرض</div><div class="result-value" style="color:var(--red)"><span>admin</span><button class="copy-btn" onclick="cpB(this,'admin')">کپی</button></div></div>
        <div class="alert alert-warn">⚠️ بلافاصله رمز عبور را تغییر دهید!</div>
        <div class="btn-group"><a id="openPanel" href="#" target="_blank" class="btn btn-primary">باز کردن پنل</a><button class="btn btn-secondary" onclick="render()">نصب جدید</button></div>
      </div>
    </div>
  `;

  // Render panel cards
  const pg=$('panelGrid');
  pg.innerHTML=Object.entries(PANELS).map(([k,p])=>`
    <div class="panel-card" data-p="${k}">
      <div class="panel-icon">${p.icon}</div>
      <div class="panel-name">${p.name}</div>
      <div class="panel-desc">${p.desc}</div>
    </div>
  `).join('');

  // Panel selection
  pg.querySelectorAll('.panel-card').forEach(c=>c.addEventListener('click',()=>{
    pg.querySelectorAll('.panel-card').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected');
    selectedPanel=c.dataset.p;
    $('deployBtn').disabled=false;
  }));

  // Validate
  $('validateBtn').addEventListener('click',async()=>{
    const token=$('tokenIn').value.trim();
    if(!token){toast('⚠️ توکن را وارد کنید');return}
    $('validateBtn').textContent='⏳ در حال بررسی...';$('validateBtn').disabled=true;
    try{
      const r=await fetch(BACKEND+'/deploy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,panelType:'validate'})});
      const d=await r.json();
      if(d.success||d.logs?.length>0){
        $('tokenResult').innerHTML='<div class="alert alert-success" style="margin-top:12px">✅ توکن معتبر است!</div>';
        $('panelCard').style.display='block';
        toast('✅ توکن معتبر!');
      } else {
        $('tokenResult').innerHTML=`<div class="alert alert-error" style="margin-top:12px">❌ ${esc(d.error||'خطا')}</div>`;
      }
    }catch(e){$('tokenResult').innerHTML=`<div class="alert alert-error" style="margin-top:12px">❌ ${esc(e.message)}</div>`}
    $('validateBtn').textContent='🔍 بررسی توکن';$('validateBtn').disabled=false;
  });

  // Deploy
  $('deployBtn').addEventListener('click',async()=>{
    const token=$('tokenIn').value.trim();
    if(!selectedPanel){toast('⚠️ پنل را انتخاب کنید');return}
    $('deployBtn').disabled=true;$('deployBtn').textContent='⏳ در حال نصب...';
    $('deployCard').style.display='block';
    $('deployLog').innerHTML='<span class="log-info">▸ شروع استقرار...</span>';
    $('resultBox').style.display='none';

    try{
      const r=await fetch(BACKEND+'/deploy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,panelType:selectedPanel})});
      const d=await r.json();
      
      // Show logs
      if(d.logs)d.logs.forEach(l=>{$('deployLog').innerHTML+=l+'<br>'});
      
      if(d.success){
        $('deployLog').innerHTML+='<br><span class="log-ok">✅ نصب با موفقیت انجام شد!</span>';
        $('resUrl').textContent=d.panelURL;$('resUrl').href=d.panelURL;
        $('resName').textContent=d.workerName;
        $('openPanel').href=d.panelURL;
        $('resultBox').style.display='block';
        $('copyUrl').addEventListener('click',function(){cpB(this,d.panelURL)});
        $('copyName').addEventListener('click',function(){cpB(this,d.workerName)});
        toast('✅ نصب کامل شد!');
      } else {
        $('deployLog').innerHTML+=`<br><span class="log-err">❌ ${esc(d.error||'خطا')}</span>`;
        toast('❌ نصب ناموفق');
      }
    }catch(e){
      $('deployLog').innerHTML+=`<br><span class="log-err">❌ خطا: ${esc(e.message)}</span>`;
      toast('❌ خطا: '+e.message);
    }
    $('deployBtn').disabled=false;$('deployBtn').textContent='🚀 نصب و فعال‌سازی';
  });
}

render();
</script>
</body>
</html>
