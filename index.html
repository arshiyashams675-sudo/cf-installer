<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>CF Installer v4.0.0</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --bg2:#12121a;
  --bg3:#1a1a26;
  --bg4:#22223a;
  --text:#e0e0ec;
  --text2:#8888a0;
  --text3:#55556a;
  --cyan:#00e5a0;
  --cyan2:#00b8ff;
  --cyan-bg:rgba(0,229,160,.12);
  --green:#00e676;
  --green-bg:rgba(0,230,118,.08);
  --red:#ff4466;
  --red-bg:rgba(255,68,102,.08);
  --yellow:#ffaa00;
  --yellow-bg:rgba(255,170,0,.08);
  --border:rgba(255,255,255,.06);
  --border2:rgba(255,255,255,.1);
  --border3:rgba(255,255,255,.15);
  --radius:14px;
  --radius2:20px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow-lg:0 12px 48px rgba(0,0,0,.6);
  --font:'Vazirmatn',system-ui,-apple-system,sans-serif;
  --font-mono:'SF Mono','Cascadia Code','Fira Code','JetBrains Mono',monospace;
  --glow:0 0 40px rgba(0,229,160,.08);
}
html{font-size:15px;scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:1.6;
  padding-bottom:40px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* Scrollbar */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.15)}

/* Background effects */
body::before{
  content:'';position:fixed;top:0;left:0;right:0;height:600px;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(0,229,160,.06),rgba(0,184,255,.03),transparent);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;bottom:0;left:0;right:0;height:400px;
  background:radial-gradient(ellipse 80% 50% at 50% 120%,rgba(0,184,255,.04),transparent);
  pointer-events:none;z-index:0;
}

.container{width:100%;max-width:680px;padding:0 20px;position:relative;z-index:1}

/* ===== HEADER ===== */
.header{
  text-align:center;
  padding:48px 0 36px;
  animation:fadeUp .6s ease-out;
}
.logo{
  font-size:2.6rem;
  font-weight:900;
  letter-spacing:6px;
  background:linear-gradient(135deg,var(--cyan) 0%,var(--cyan2) 50%,#a78bfa 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 30px rgba(0,229,160,.2));
  margin-bottom:6px;
}
.logo-sub{
  color:var(--text2);
  font-size:.88rem;
  font-weight:400;
  margin-top:4px;
  opacity:.7;
}
.logo-ver{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:4px 14px;
  font-size:.72rem;
  font-weight:500;
  color:var(--text3);
  margin-top:14px;
  letter-spacing:.5px;
}
.logo-ver::before{
  content:'';width:6px;height:6px;
  background:var(--cyan);border-radius:50%;
  box-shadow:0 0 8px var(--cyan);
}

/* ===== CARDS ===== */
.card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius2);
  padding:32px;
  box-shadow:var(--shadow);
  width:100%;
  margin-bottom:20px;
  backdrop-filter:blur(20px);
  position:relative;
  overflow:hidden;
  animation:fadeUp .5s ease-out both;
  transition:border-color .3s,box-shadow .3s;
}
.card:hover{
  border-color:var(--border2);
  box-shadow:var(--shadow-lg);
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
}
.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.2s}

.card-title{
  font-size:1.15rem;
  font-weight:700;
  margin-bottom:4px;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:10px;
}
.card-title .icon{
  width:36px;height:36px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:1.1rem;flex-shrink:0;
  background:rgba(0,229,160,.1);
}
.card-subtitle{
  color:var(--text2);
  font-size:.85rem;
  margin-bottom:24px;
  font-weight:400;
}

/* ===== FORM ELEMENTS ===== */
.form-group{margin-bottom:20px}
.form-label{
  display:block;
  font-size:.82rem;
  font-weight:600;
  color:var(--text2);
  margin-bottom:8px;
  letter-spacing:.3px;
}
.form-input{
  width:100%;
  padding:14px 16px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border2);
  border-radius:12px;
  color:var(--text);
  font-size:.92rem;
  font-family:var(--font-mono);
  transition:all .3s cubic-bezier(.4,0,.2,1);
  outline:none;
  min-height:48px;
}
.form-input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,229,160,.1),inset 0 1px 2px rgba(0,0,0,.2);
  background:rgba(255,255,255,.05);
}
.form-input::placeholder{color:var(--text3);font-family:var(--font);font-weight:400}
.form-hint{font-size:.78rem;color:var(--text3);margin-top:6px}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:13px 28px;
  border-radius:12px;
  font-size:.9rem;
  font-weight:600;
  cursor:pointer;
  border:none;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  font-family:var(--font);
  min-height:48px;
  text-decoration:none;
  white-space:nowrap;
  position:relative;
  overflow:hidden;
}
.btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);
  opacity:0;transition:opacity .3s;
}
.btn:hover::after{opacity:1}
.btn-primary{
  background:linear-gradient(135deg,var(--cyan),#00c990);
  color:#0a0a0f;
  box-shadow:0 4px 20px rgba(0,229,160,.25);
  font-weight:700;
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(0,229,160,.35);
}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}
.btn-primary:disabled::after{display:none}
.btn-secondary{
  background:rgba(255,255,255,.04);
  color:var(--text);
  border:1px solid var(--border2);
}
.btn-secondary:hover{
  border-color:var(--cyan);
  color:var(--cyan);
  background:rgba(0,229,160,.05);
}
.btn-group{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn-sm{padding:9px 18px;font-size:.82rem;min-height:38px;border-radius:10px}

/* ===== ALERTS ===== */
.alert{
  padding:14px 18px;
  border-radius:12px;
  font-size:.84rem;
  margin-bottom:16px;
  display:flex;
  align-items:flex-start;
  gap:10px;
  line-height:1.5;
  backdrop-filter:blur(8px);
}
.alert-info{background:rgba(0,229,160,.08);border:1px solid rgba(0,229,160,.12);color:var(--cyan)}
.alert-success{background:rgba(0,230,118,.06);border:1px solid rgba(0,230,118,.12);color:var(--green)}
.alert-error{background:rgba(255,68,102,.06);border:1px solid rgba(255,68,102,.12);color:var(--red)}
.alert-warn{background:rgba(255,170,0,.06);border:1px solid rgba(255,170,0,.12);color:var(--yellow)}

/* ===== SPINNER ===== */
.spinner{
  width:18px;height:18px;
  border:2.5px solid var(--border2);
  border-top-color:var(--cyan);
  border-radius:50%;
  animation:spin .8s linear infinite;
  flex-shrink:0;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== DEPLOY LOG ===== */
.deploy-log{
  background:rgba(0,0,0,.4);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px;
  font-family:var(--font-mono);
  font-size:.82rem;
  max-height:300px;
  overflow-y:auto;
  line-height:1.9;
  color:var(--text2);
  margin-top:16px;
  direction:ltr;
  text-align:left;
}
.deploy-log .log-ok{color:var(--green)}
.deploy-log .log-err{color:var(--red)}
.deploy-log .log-info{color:var(--cyan)}

/* ===== PANEL GRID ===== */
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.panel-card{
  background:rgba(255,255,255,.02);
  border:1.5px solid var(--border2);
  border-radius:16px;
  padding:22px 16px;
  cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  text-align:center;
  position:relative;
  overflow:hidden;
}
.panel-card::before{
  content:'';position:absolute;inset:0;
  opacity:0;transition:opacity .3s;
  border-radius:16px;
}
.panel-card[data-p="nahan"]::before{background:linear-gradient(135deg,rgba(139,92,246,.08),rgba(59,130,246,.05))}
.panel-card[data-p="edge"]::before{background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(239,68,68,.05))}
.panel-card[data-p="cfnew"]::before{background:linear-gradient(135deg,rgba(0,229,160,.08),rgba(0,184,255,.05))}
.panel-card[data-p="nova"]::before{background:linear-gradient(135deg,rgba(0,184,255,.08),rgba(168,85,247,.05))}
.panel-card[data-p="edgtun"]::before{background:linear-gradient(135deg,rgba(255,170,0,.08),rgba(0,230,118,.05))}
.panel-card[data-p="zeus"]::before{background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(255,170,0,.05))}
.panel-card[data-p="fox"]::before{background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(168,85,247,.05))}
.panel-card[data-p="amcf"]::before{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(239,68,68,.05))}
.panel-card[data-p="vtpanel"]::before{background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(168,85,247,.05))}

.panel-card:hover{
  border-color:var(--border3);
  transform:translateY(-4px);
  box-shadow:0 8px 32px rgba(0,0,0,.3);
}
.panel-card:hover::before{opacity:1}
.panel-card.selected{
  border-color:var(--cyan);
  box-shadow:0 0 32px rgba(0,229,160,.12),0 8px 32px rgba(0,0,0,.3);
}
.panel-card.selected::before{opacity:1}
.panel-card.selected .panel-icon-wrap{
  background:rgba(0,229,160,.15);
  border-color:rgba(0,229,160,.2);
}
.panel-icon-wrap{
  width:52px;height:52px;
  margin:0 auto 12px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.6rem;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  transition:all .3s;
}
.panel-name{font-weight:700;font-size:.95rem;margin-bottom:4px;color:var(--text)}
.panel-desc{font-size:.76rem;color:var(--text3);font-weight:400;line-height:1.4}

/* ===== PANEL VAR INPUTS ===== */
.panel-vars{margin-top:16px;display:none}
.panel-vars.show{display:block}
.panel-vars .form-group{margin-bottom:0}

/* ===== RESULT BOXES ===== */
.result-box{
  background:rgba(255,255,255,.02);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px 18px;
  margin-bottom:12px;
  transition:all .3s;
}
.result-box:hover{border-color:var(--border2);background:rgba(255,255,255,.03)}
.result-label{
  font-size:.75rem;
  color:var(--text2);
  margin-bottom:6px;
  font-weight:500;
  letter-spacing:.3px;
}
.result-value{
  font-family:var(--font-mono);
  font-size:.88rem;
  color:var(--cyan);
  overflow-wrap:anywhere;
  word-break:break-all;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  direction:ltr;
  text-align:left;
}
.copy-btn{
  background:rgba(255,255,255,.04);
  border:1px solid var(--border2);
  color:var(--text2);
  padding:6px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:.78rem;
  font-family:var(--font);
  transition:all .3s;
  flex-shrink:0;
  font-weight:500;
}
.copy-btn:hover{
  color:var(--cyan);
  border-color:rgba(0,229,160,.3);
  background:rgba(0,229,160,.08);
}
.copy-btn.copied{
  color:var(--green);
  border-color:rgba(0,230,118,.3);
  background:rgba(0,230,118,.08);
}

.divider{
  border:none;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--border2),transparent);
  margin:24px 0;
}

/* ===== TOAST ===== */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(120px);
  background:rgba(18,18,26,.9);
  backdrop-filter:blur(20px);
  border:1px solid var(--border2);
  border-radius:14px;
  padding:14px 24px;
  font-size:.85rem;
  font-weight:500;
  color:var(--text);
  z-index:100;
  opacity:0;
  transition:all .4s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

/* ===== FOOTER ===== */
.footer{
  text-align:center;
  padding:40px 0 20px;
  width:100%;
  max-width:680px;
  position:relative;
  z-index:1;
}
.footer-divider{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--border2),transparent);
  margin:0 0 24px;
}
.footer-title{
  font-size:.82rem;
  font-weight:600;
  color:var(--text2);
  margin-bottom:16px;
  letter-spacing:.3px;
}
.footer-stars{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px 16px;
}
.footer-star{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:.78rem;
  color:var(--text3);
  font-weight:500;
  padding:4px 10px;
  background:rgba(255,255,255,.02);
  border:1px solid var(--border);
  border-radius:8px;
  transition:all .3s;
}
.footer-star:hover{
  border-color:var(--border2);
  color:var(--text2);
  background:rgba(255,255,255,.04);
}
.footer-star .star-icon{color:var(--yellow);font-size:.85rem}
.footer-copy{
  margin-top:16px;
  font-size:.72rem;
  color:var(--text3);
  opacity:.6;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

/* ===== RESPONSIVE ===== */
@media(max-width:640px){
  html{font-size:14px}
  .container{padding:0 16px}
  .header{padding:36px 0 28px}
  .logo{font-size:2rem;letter-spacing:4px}
  .card{padding:24px;border-radius:16px}
  .panel-grid{grid-template-columns:1fr;gap:12px}
  .panel-card{padding:18px 14px}
  .btn-group{flex-direction:column}
  .btn-group .btn{width:100%}
  .result-value{flex-direction:column;align-items:flex-start;gap:8px}
  .copy-btn{align-self:flex-end}
  .footer-stars{gap:6px 10px}
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo">CF INSTALLER</div>
    <div class="logo-sub">نصب‌کننده خودکار پنل‌های Cloudflare Worker</div>
    <div class="logo-ver">v4.0.0</div>

  <div id="content"></div>
</div>

<!-- Footer -->
<div class="footer" id="appFooter">
  <div class="footer-divider"></div>
  <div class="footer-title">⭐ ستاره‌های پنل‌ها در GitHub</div>
  <div class="footer-stars" id="footerStars"></div>

</div>

<div class="toast" id="toast"></div>

<script>
const BACKEND='https://cf-installer-backend.bldj.workers.dev';
const SECRET='zIuH2xBTVeFv3crIK-pibj5nY9qrJPH9kI2hEgzrK1A';

const PANELS={
  nahan:{name:'Nahan Panel',icon:'🌙',desc:'پنل سبک و سریع با D1',key:'nahan'},
  edge:{name:'EdgeTunnel',icon:'⚡',desc:'پنل حرفه‌ای و محبوب با KV',key:'edge'},

};

const PANEL_STARS={
  nahan:3082,edge:41735,cfnew:14694,nova:3207,edgtun:2989,
  zeus:813,fox:151,amcf:3126,vtpanel:62
};

let selectedPanel=null;
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function esc(s){return s?String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])):''}
function cpB(b,t){navigator.clipboard.writeText(t).then(()=>{const o=b.textContent;b.textContent='کپی شد!';b.classList.add('copied');setTimeout(()=>{b.textContent=o;b.classList.remove('copied')},1500)})}

function renderFooter(){
  const el=$('footerStars');
  el.innerHTML=Object.entries(PANEL_STARS).map(([k,s])=>{
    const p=PANELS[k];
    return `<span class="footer-star"><span class="star-icon">⭐</span>${p?p.icon:''} ${p?p.name:k}: ${s>0?s.toLocaleString():'—'}</span>`;
  }).join('');
}

function render(){
  const el=$('content');
  el.innerHTML=`
    <div class="card">
      <div class="card-title"><span class="icon">🔑</span> توکن Cloudflare API</div>
      <div class="card-subtitle">API Token خود را وارد کنید</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
        <a href="https://dash.cloudflare.com/profile/api-tokens?permissionGroupKeys=%5B%7B%22key%22%3A%22workers_scripts%22%2C%22type%22%3A%22edit%22%7D%2C%7B%22key%22%3A%22workers_kv_storage%22%2C%22type%22%3A%22edit%22%7D%2C%7B%22key%22%3A%22d1%22%2C%22type%22%3A%22edit%22%7D%2C%7B%22key%22%3A%22workers_settings%22%2C%22type%22%3A%22read%22%7D%2C%7B%22key%22%3A%22user_details%22%2C%22type%22%3A%22read%22%7D%5D&accountId=*&zoneId=all&name=CF-Installer" target="_blank" class="btn btn-primary btn-sm" style="text-decoration:none">🔑 ساخت توکن</a>
      </div>
      <div class="form-group"><label class="form-label">API Token</label>
      <input type="password" class="form-input" id="tokenIn" placeholder="cfut_xxxxxxxxxxxxxxxx" autocomplete="off" style="direction:ltr;text-align:left"></div>
      <button class="btn btn-primary" id="validateBtn">🔍 بررسی توکن</button>
      <div id="tokenResult"></div>
    </div>
    <div class="card" id="panelCard" style="display:none">
      <div class="card-title"><span class="icon">🎯</span> پنل مورد نظر را انتخاب کنید</div>
      <div class="panel-grid" id="panelGrid"></div>
      <div id="panelVars" class="panel-vars"></div>
      <div class="alert alert-info">💡 اسم Worker به صورت خودکار و رندوم ساخته میشود</div>
      <button class="btn btn-primary" id="deployBtn" disabled>🚀 نصب و فعال‌سازی</button>
    </div>
    <div class="card" id="deployCard" style="display:none">
      <div class="card-title"><span class="icon">📦</span> در حال استقرار...</div>
      <div id="deployLog" class="deploy-log"></div>
      <div id="resultBox" style="display:none">
        <hr class="divider">
        <div class="result-box"><div class="result-label">آدرس پنل</div><div class="result-value"><a id="resUrl" href="#" target="_blank" style="color:var(--cyan);text-decoration:none"></a><button class="copy-btn" id="copyUrl">کپی</button></div></div>
        <div class="result-box"><div class="result-label">نام Worker</div><div class="result-value"><span id="resName"></span><button class="copy-btn" id="copyName">کپی</button></div></div>
        <div class="result-box"><div class="result-label">مسیر پنل</div><div class="result-value" style="color:var(--yellow)"><span id="resPath"></span><button class="copy-btn" id="copyPath">کپی</button></div></div>
        <div class="result-box" id="uuidBox" style="display:none"><div class="result-label">UUID (Cfnew)</div><div class="result-value"><span id="resUuid"></span><button class="copy-btn" id="copyUuid">کپی</button></div></div>
        <div class="result-box"><div class="result-label">رمز عبور پیش‌فرض</div><div class="result-value" style="color:var(--red)"><span id="resPasswd">admin</span><button class="copy-btn" onclick="cpB(this,'admin')">کپی</button></div></div>
        <div class="alert alert-warn">⚠️ بلافاصله رمز عبور را تغییر دهید!</div>
        <div id="edgtunPaths" style="display:none">
          <div class="result-box"><div class="result-label">🌐 VLESS کانفیگ</div><div class="result-value"><a id="edVless" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyEdVless">کپی</button></div></div>
          <div class="result-box"><div class="result-label">🔗 VLESS لینک مستقیم</div><div class="result-value"><a id="edVlessLink" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyEdVlessLink">کپی</button></div></div>

        </div>
        <div id="foxPaths" style="display:none">
          <div class="result-box"><div class="result-label">📊 صفحه وضعیت</div><div class="result-value"><a id="foxRoot" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyFoxRoot">کپی</button></div></div>
          <div class="result-box"><div class="result-label">📑 صفحه اشتراک</div><div class="result-value"><a id="foxSub" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyFoxSub">کپی</button></div></div>
          <div class="result-box"><div class="result-label">🔗 VLESS لینک مستقیم</div><div class="result-value"><a id="foxVless" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyFoxVless">کپی</button></div></div>
        </div>
        <div id="amcfPaths" style="display:none">
          <div class="result-box"><div class="result-label">🔐 صفحه لاگین</div><div class="result-value"><a id="amcfRoot" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyAmcfRoot">کپی</button></div></div>
          <div class="result-box"><div class="result-label">📑 صفحه اشتراک</div><div class="result-value"><a id="amcfSub" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyAmcfSub">کپی</button></div></div>
          <div class="result-box"><div class="result-label">🔗 VLESS لینک مستقیم</div><div class="result-value"><a id="amcfVless" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyAmcfVless">کپی</button></div></div>
          <div class="result-box"><div class="result-label">🔑 رمز لاگین (UUID)</div><div class="result-value" style="color:var(--red)"><span id="amcfUuid"></span><button class="copy-btn" id="copyAmcfUuid">کپی</button></div></div>
        </div>
        <div id="vtpanelPaths" style="display:none">
          <div class="result-box"><div class="result-label">📊 صفحه وضعیت</div><div class="result-value"><a id="vtpRoot" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyVtpRoot">کپی</button></div></div>
          <div class="result-box"><div class="result-label">🔑 رمز ورود</div><div class="result-value" style="color:var(--yellow)"><span id="vtpPass">admin</span><button class="copy-btn" onclick="cpB(this,'admin')">کپی</button></div></div>
        </div>


        <div class="btn-group"><a id="openPanel" href="#" target="_blank" class="btn btn-primary">باز کردن پنل</a><button class="btn btn-secondary" onclick="render()">نصب جدید</button></div>
      </div>
    </div>
  `;

  // Render panel cards
  const pg=$('panelGrid');
  pg.innerHTML=Object.entries(PANELS).map(([k,p])=>`
    <div class="panel-card" data-p="${k}">
      <div class="panel-icon-wrap">${p.icon}</div>
      <div class="panel-name">${p.name}</div>
      <div class="panel-desc">${p.desc}</div>
    </div>
  `).join('');

  // Panel selection
  pg.querySelectorAll('.panel-card').forEach(c=>c.addEventListener('click',()=>{
    pg.querySelectorAll('.panel-card').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected');
    selectedPanel=c.dataset.p;
    $('deployBtn').disabled=false;
    updatePanelVars(selectedPanel);
  }));

  // Validate
  $('validateBtn').addEventListener('click',async()=>{
    const token=$('tokenIn').value.trim();
    if(!token){toast('⚠️ توکن را وارد کنید');return}
    $('validateBtn').textContent='⏳ در حال بررسی...';$('validateBtn').disabled=true;
    try{
      const r=await fetch(BACKEND+'/deploy',{method:'POST',headers:{'Content-Type':'application/json','X-Secret':SECRET},body:JSON.stringify({token,panelType:'validate'})});
      const d=await r.json();
      if(d.success||d.logs?.length>0){
        $('tokenResult').innerHTML='<div class="alert alert-success" style="margin-top:12px">✅ توکن معتبر است!</div>';
        $('panelCard').style.display='block';
        toast('✅ توکن معتبر!');
      } else {
        $('tokenResult').innerHTML=`<div class="alert alert-error" style="margin-top:12px">❌ ${esc(d.error||'خطا')}</div>`;
      }
    }catch(e){$('tokenResult').innerHTML=`<div class="alert alert-error" style="margin-top:12px">❌ ${esc(e.message)}</div>`}
    $('validateBtn').textContent='🔍 بررسی توکن';$('validateBtn').disabled=false;
  });

  // Deploy
  $('deployBtn').addEventListener('click',async()=>{
    const token=$('tokenIn').value.trim();
    if(!selectedPanel){toast('⚠️ پنل را انتخاب کنید');return}
    $('deployBtn').disabled=true;$('deployBtn').textContent='⏳ در حال نصب...';
    $('deployCard').style.display='block';
    $('deployLog').innerHTML='<span class="log-info">▸ شروع استقرار...</span>';
    $('resultBox').style.display='none';

    // Gather panel-specific vars
    const cfg=PANELS_CONFIG[selectedPanel];
    const vars={};
    if(cfg&&cfg.vars){
      Object.entries(cfg.vars).forEach(([k,v])=>{
        const inp=$('var_'+k);
        if(inp) vars[k]=inp.value.trim()||v;
        else vars[k]=v;
      });
    }

    const payload={token,panelType:selectedPanel,vars};
    if(cfg&&cfg.pages) payload.pages=true;

    try{
      const r=await fetch(BACKEND+'/deploy',{method:'POST',headers:{'Content-Type':'application/json','X-Secret':SECRET},body:JSON.stringify(payload)});
      const d=await r.json();
      
      // Show logs
      if(d.logs)d.logs.forEach(l=>{$('deployLog').innerHTML+=l+'<br>'});
      
      if(d.success){
        $('deployLog').innerHTML+='<br><span class="log-ok">✅ نصب با موفقیت انجام شد!</span><br><span class="log-info">⏳ چند دقیقه صبر کنید تا ورکر فعال شود</span>';
        $('resUrl').textContent=d.panelURL;$('resUrl').href=d.panelURL;
        $('resName').textContent=d.workerName;
        $('resPath').textContent=d.panelPath||'/';
        $('openPanel').href=d.panelURL;
        $('resultBox').style.display='block';

        // Hide all special sections first
        ['uuidBox','edgtunPaths','foxPaths','amcfPaths','vtpanelPaths'].forEach(id=>{$(id).style.display='none'});

        // Show UUID for Cfnew
        if(d.uuid){
          $('uuidBox').style.display='block';
          $('resUuid').textContent=d.uuid;
          $('copyUuid').addEventListener('click',function(){cpB(this,d.uuid)});
        }

        // EDtunnel paths with actual URLs
        if(d.panelType==='edgtun' && d.uuid){
          $('edgtunPaths').style.display='block';
          const base=d.panelURL;
          const uuid=d.uuid;
          const host=new URL(base).host;
          const vlessLink='vless://'+uuid+'@'+host+'?encryption=none&type=ws#CF-Worker';
          const vlessUrl=base+'/'+uuid;

          $('edVless').textContent=vlessUrl;$('edVless').href=vlessUrl;
          $('edVlessLink').textContent=vlessLink;$('edVlessLink').href=vlessLink;

          $('copyEdVless').addEventListener('click',function(){cpB(this,vlessUrl)});
          $('copyEdVlessLink').addEventListener('click',function(){cpB(this,vlessLink)});

        }

        // FoxCloud paths
        if(d.panelType==='fox' && d.uuid){
          $('foxPaths').style.display='block';
          const base=d.panelURL;
          const uuid=d.uuid;
          const host=new URL(base).host;
          const foxRoot=base;
          const foxSub=base+'/sub';
          const foxVless='vless://'+uuid+'@'+host+':443?encryption=none&security=tls&sni='+host+'&fp=chrome&type=ws&host='+host+'&path=/ws#CF-Worker';
          $('foxRoot').textContent=foxRoot;$('foxRoot').href=foxRoot;
          $('foxSub').textContent=foxSub;$('foxSub').href=foxSub;
          $('foxVless').textContent=foxVless;$('foxVless').href=foxVless;
          $('copyFoxRoot').addEventListener('click',function(){cpB(this,foxRoot)});
          $('copyFoxSub').addEventListener('click',function(){cpB(this,foxSub)});
          $('copyFoxVless').addEventListener('click',function(){cpB(this,foxVless)});
        }

        // am-cf-tunnel paths
        if(d.panelType==='amcf' && d.uuid){
          $('amcfPaths').style.display='block';
          const base=d.panelURL;
          const uuid=d.uuid;
          const host=new URL(base).host;
          const amcfRoot=base;
          const amcfSub=base+'/sub';
          const amcfVless='vless://'+uuid+'@'+host+':443?encryption=none&type=ws#CF-Worker';
          $('amcfRoot').textContent=amcfRoot;$('amcfRoot').href=amcfRoot;
          $('amcfSub').textContent=amcfSub;$('amcfSub').href=amcfSub;
          $('amcfVless').textContent=amcfVless;$('amcfVless').href=amcfVless;
          $('amcfUuid').textContent=uuid;
          $('copyAmcfRoot').addEventListener('click',function(){cpB(this,amcfRoot)});
          $('copyAmcfSub').addEventListener('click',function(){cpB(this,amcfSub)});
          $('copyAmcfVless').addEventListener('click',function(){cpB(this,amcfVless)});
          $('copyAmcfUuid').addEventListener('click',function(){cpB(this,uuid)});
        }

        // ZQ-VTPanel paths
        if(d.panelType==='vtpanel'){
          $('vtpanelPaths').style.display='block';
          const base=d.panelURL;
          $('vtpRoot').textContent=base;$('vtpRoot').href=base;
          $('copyVtpRoot').addEventListener('click',function(){cpB(this,base)});
        }

        $('copyUrl').addEventListener('click',function(){cpB(this,d.panelURL)});
        $('copyName').addEventListener('click',function(){cpB(this,d.workerName)});
        $('copyPath').addEventListener('click',function(){cpB(this,d.panelPath||'/')});
        toast('✅ نصب کامل شد!');
      } else {
        $('deployLog').innerHTML+=`<br><span class="log-err">❌ ${esc(d.error||'خطا')}</span>`;
        toast('❌ نصب ناموفق');
      }
    }catch(e){
      $('deployLog').innerHTML+=`<br><span class="log-err">❌ خطا: ${esc(e.message)}</span>`;
      toast('❌ خطا: '+e.message);
    }
    $('deployBtn').disabled=false;$('deployBtn').textContent='🚀 نصب و فعال‌سازی';
  });
}

// Show variable inputs for panels that need them
function updatePanelVars(panel){
  const pv=$('panelVars');
  if(!pv){return}
  const cfg=PANELS_CONFIG[panel];
  if(!cfg||!cfg.vars||Object.keys(cfg.vars).length===0){
    pv.classList.remove('show');
    pv.innerHTML='';
    return;
  }
  let html='';
  Object.entries(cfg.vars).forEach(([k,v])=>{
    const label=k==='uid'?'UUID (شناسه یکتای کاربر)':k==='Pswd'?'رمز Trojan':'مقدار '+k;
    const placeholder=k==='uid'?'مثلاً: 12345678-1234-1234-1234-123456789abc':k==='Pswd'?'پیش‌فرض: trojan':v;
    html+=`<div class="form-group" style="margin-bottom:16px"><label class="form-label">${label}</label><input type="text" class="form-input" id="var_${k}" value="${esc(v)}" placeholder="${placeholder}" style="direction:ltr;text-align:left"></div>`;
  });
  pv.innerHTML=html;
  pv.classList.add('show');
}

render();
renderFooter();
</script>
</body>
</html>
